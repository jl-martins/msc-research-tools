[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "dacapo-hot-loops"
version = "0.1.0"
description = "Find and analyze hot loops in DaCapo benchmarks"
requires-python = ">=3.14,<3.15"
dependencies = [
    "polars~=1.44.2",
    "pydantic~=2.13.5",
    "scipy~=1.18.1",
    "tabulate~=0.10.0",
    "tree-sitter~=0.26.0",
    "tree-sitter-java~=0.23.5",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "ruff~=0.16.10",
]

[project.scripts]
dacapo-hot-loops = "dacapo_hot_loops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
