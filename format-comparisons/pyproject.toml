[project]
name = "format-comparisons"
version = "0.1.0"
description = "Format comparisons based on effect size confidence intervals"
requires-python = ">=3.14"
dependencies = [
    "openpyxl~=3.1.5",
    "polars~=1.42.1",
]

[dependency-groups]
dev = [
    "ruff~=0.15.16",
    "types-openpyxl~=3.1.5.20260518",
]

[project.scripts]
format-comparisons = "format_comparisons:main"

[tool.uv]
package = true
