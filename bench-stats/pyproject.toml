[project]
name = "bench-stats"
version = "0.1.0"
description = "Generate benchmark statistics for Master's Dissertation"
requires-python = ">=3.14"
dependencies = [
    "adjusttext~=1.4.0",
    "inflection~=0.5.1",
    "matplotlib~=3.10.3",
    "numpy~=2.4.6",
    "polars~=1.41.2",
    "scipy~=1.17.1",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "ruff~=0.15.16",
    "scipy-stubs~=1.17.1",
]

[project.scripts]
bench-stats = "bench_stats:main"

[tool.setuptools]
py-modules = [
    "bench_stats",
    "effect_sizes",
    "jobs",
    "measurements",
    "plots",
    "rank_corr",
]

[tool.uv]
package = true
