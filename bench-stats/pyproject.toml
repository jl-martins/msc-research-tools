[project]
name = "bench-stats"
version = "0.1.0"
description = "Generate benchmark statistics for Master's Dissertation"
requires-python = ">=3.14"
dependencies = [
    "inflection~=0.5.1",
    "matplotlib~=3.10.3",
    "numpy~=2.4.6",
    "polars~=1.41.2",
    "scipy~=1.17.1",
    "seaborn~=0.13.2",
    "statsmodels~=0.14.6",
]

[dependency-groups]
dev = [
    "ruff~=0.15.16",
    "scipy-stubs~=1.17.1",
]

[project.scripts]
bench-stats = "bench_stats:main"

[tool.uv]
package = true
