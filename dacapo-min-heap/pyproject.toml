[project]
name = "dacapo-min-heap"
version = "0.1.0"
description = "Find the minimum heap size of DaCapo benchmarks"
requires-python = ">=3.14,<3.15"
dependencies = [
    "psutil~=7.2.2",
    "pydantic~=2.13.4",
]

[dependency-groups]
dev = [
    "ruff~=0.15.16",
    "types-psutil~=7.2.2.20260518",
]

[project.scripts]
dacapo-min-heap = "dacapo_min_heap:main"

[tool.uv]
package = true
