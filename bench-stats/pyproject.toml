[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "bench-stats"
version = "0.1.0"
description = "Generate benchmark statistics for Master's Dissertation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "adjusttext~=1.4.0",
    "inflection~=0.5.1",
    "matplotlib~=3.10.3",
    "numpy~=2.4.6",
    "polars~=1.44.2",
    "scipy~=1.18.1",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "ruff~=0.16.10",
    "scipy-stubs~=1.18.1",
]

[project.scripts]
bench-stats = "bench_stats.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
